<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Video Detection System</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
            --success: #10b981;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --bg-main: #ffffff;
            --bg-card: #f9fafb;
            --border-light: #e5e7eb;
        }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
        }

        /* Navbar */
        .navbar {
            background: #ffffff;
            border-bottom: 1px solid var(--border-light);
        }
        .navbar-brand {
            color: var(--primary) !important;
        }
        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
        }
        .nav-link:hover {
            color: var(--primary) !important;
        }

        /* Hero */
        .hero {
            padding: 120px 0 60px;
            text-align: center;
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        /* Cards */
        .card-box {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 45px;
            border: 1px solid var(--border-light);
            margin-bottom: 60px;
        }

        /* Upload */
        .upload-zone {
            border: 2px dashed var(--primary);
            border-radius: 15px;
            padding: 60px;
            text-align: center;
            cursor: pointer;
            background: #ffffff;
        }
        .upload-zone:hover {
            background: #f1f5ff;
        }
        .upload-zone i {
            font-size: 3.5rem;
            color: var(--primary);
        }

        .btn-upload {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border: none;
            padding: 14px 45px;
            border-radius: 50px;
            font-weight: 600;
            color: #fff;
        }

        /* Section */
        .section-title {
            text-align: center;
            font-size: 2.3rem;
            font-weight: 700;
            margin-bottom: 50px;
            color: var(--text-main);
        }

        /* Steps */
        .step-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid var(--border-light);
            height: 100%;
        }

        .step-number {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-bottom: 15px;
        }

        /* Verification */
        .security-step {
            display: flex;
            margin-bottom: 25px;
        }

        .security-num {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--success);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 18px;
            font-weight: 700;
        }

        .file-name {
            color: var(--primary);
            font-weight: 600;
            margin-top: 10px;
            display: none;
        }

        .spinner-border {
            display: none;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <i class="fas fa-shield-alt"></i> DeepfakeGuard
        </a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                 
                <li class="nav-item"><a class="nav-link" href="{{url_for('index')}}">Detection</a></li>
                <li class="nav-item"><a class="nav-link" href="{{url_for('verify')}}">Verification</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">

    <!-- HERO -->
    <div class="hero">
        <h1>Deepfake Detection System</h1>
        <p>AI-powered video authentication with cryptographic verification</p>
    </div>

 
    <div class="card-box" id="upload">
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="upload-zone" onclick="fileInput.click()">
                <i class="fas fa-cloud-upload-alt"></i>
                <h4 class="mt-3">Upload Video File</h4>
                <p class="text-muted">MP4, AVI, MOV (Max 100MB)</p>
            </div>
            <input type="file" id="fileInput" name="video" accept="video/*" hidden onchange="showFile(event)">
            <div class="file-name" id="fileName"></div>

            <div class="text-center mt-4">
                <button class="btn btn-upload" id="uploadBtn">
                    <span id="btnText">Verify Video</span>
                    <span class="spinner-border spinner-border-sm ms-2" id="spinner"></span>
                </button>
            </div>
        </form>
    </div>
       <div class="card-box" id="verification">
        
       
        
    {% if result %}
    <div class="alert alert-success mt-4 text-center">
        <h4>{{ result }}</h4>
        <p><strong>File:</strong> {{ filename }}</p>
    </div>
    {% endif %}

    {% if error %}
    <div class="alert alert-danger mt-4 text-center">
        {{ error }}
    </div>
    {% endif %}
        </div>
    </div>



</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function showFile(e) {
    const file = e.target.files[0];
    if (file) {
        fileName.textContent = "Selected: " + file.name;
        fileName.style.display = "block";
    }
}

uploadForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!fileInput.files.length) {
        alert("Please select a video file");
        return;
    }

    const formData = new FormData(uploadForm);

    uploadBtn.disabled = true;
    btnText.textContent = "Analyzing...";
    spinner.style.display = "inline-block";

    try {
        const res = await fetch("/verify", {
            method: "POST",
            body: formData
        });

        const html = await res.text();
        document.body.innerHTML = html;  // Replace page with response

    } catch (err) {
        alert("Server error");
        console.error(err);
    } finally {
        uploadBtn.disabled = false;
        btnText.textContent = "Analyze Video";
        spinner.style.display = "none";
    }
});
</script>
</body>
</html>
